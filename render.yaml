services:
  - type: web
    name: grocery-price-comparator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BROWSERLESS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
